name: Restore libass AARs
description: Copy app/libs out of the runner's cache volume. Never builds — the libass workflow does that.

runs:
  using: composite
  steps:
    - id: key
      uses: ./.github/actions/libass-key

    - name: Copy libass AARs into app/libs
      shell: bash
      run: |
        set -euo pipefail
        SOURCE="/cache/libass/${{ steps.key.outputs.key }}"
        if [ ! -d "${SOURCE}" ]; then
          echo "No libass AARs at ${SOURCE}."
          echo "Run the 'libass' workflow, then retry this one."
          exit 1
        fi
        mkdir -p app/libs
        cp -a "${SOURCE}/." app/libs/
        ls -l app/libs
