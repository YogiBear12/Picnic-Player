name: libass

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: libass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: ./.github/actions/android-sdk

      - name: Cache key
        id: key
        uses: ./.github/actions/libass-key

      - name: Look for an existing build
        id: existing
        run: |
          set -euo pipefail
          TARGET="/cache/libass/${{ steps.key.outputs.key }}"
          echo "target=${TARGET}" >> "${GITHUB_OUTPUT}"
          if [ -d "${TARGET}" ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
            echo "Already built:"
            ls -l "${TARGET}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install libass build tools
        if: steps.existing.outputs.present != 'true'
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool autopoint gperf pkg-config

      - name: Install the NDK and CMake
        if: steps.existing.outputs.present != 'true'
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build libass AARs
        if: steps.existing.outputs.present != 'true'
        env:
          LIBASS_REPO_URL: ${{ secrets.LIBASS_REPO_URL }}
        run: |
          set -euo pipefail
          chmod +x tools/build-libass.sh
          tools/build-libass.sh

      - name: Publish to the cache volume
        if: steps.existing.outputs.present != 'true'
        run: |
          set -euo pipefail
          TARGET="${{ steps.existing.outputs.target }}"
          STAGING="${TARGET}.incomplete"
          rm -rf "${STAGING}"
          mkdir -p "${STAGING}"
          cp -a app/libs/m2 "${STAGING}/"
          mv "${STAGING}" "${TARGET}"
          ls -l "${TARGET}"
