# Builds the media3 FFmpeg decoder AAR into the runner's /cache volume, which CI and the APK
# build restore from. Run this after bumping media3 or editing tools/build-ffmpeg-decoder.sh.

name: FFmpeg decoder

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ffmpeg-decoder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: ./.github/actions/android-sdk

      - name: Cache key
        id: key
        uses: ./.github/actions/ffmpeg-decoder-key

      - name: Look for an existing build
        id: existing
        run: |
          set -euo pipefail
          TARGET="/cache/ffmpeg-decoder/${{ steps.key.outputs.key }}"
          echo "target=${TARGET}" >> "${GITHUB_OUTPUT}"
          if [ -d "${TARGET}" ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
            echo "Already built:"
            ls -l "${TARGET}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install the NDK
        if: steps.existing.outputs.present != 'true'
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "ndk;27.0.12077973"

      - name: Build the decoder AAR
        if: steps.existing.outputs.present != 'true'
        run: |
          set -euo pipefail
          chmod +x tools/build-ffmpeg-decoder.sh
          tools/build-ffmpeg-decoder.sh "${ANDROID_SDK_ROOT}/ndk/27.0.12077973"

      # Written last and to a key-named directory, so a half-finished build never looks complete.
      - name: Publish to the cache volume
        if: steps.existing.outputs.present != 'true'
        run: |
          set -euo pipefail
          TARGET="${{ steps.existing.outputs.target }}"
          STAGING="${TARGET}.incomplete"
          rm -rf "${STAGING}"
          mkdir -p "${STAGING}"
          cp app/libs/*.aar "${STAGING}/"
          mv "${STAGING}" "${TARGET}"
          ls -l "${TARGET}"
