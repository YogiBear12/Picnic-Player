# Manual Android TV APK build (Forgejo Actions / self-hosted ubuntu-latest).
# Native Kotlin + Compose app. Artifacts: upload-artifact@v3
# (Forgejo does not support v4).

name: Build Android TV

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type
        type: choice
        required: true
        default: debug
        options:
          - debug
          - release

defaults:
  run:
    shell: bash

concurrency:
  group: build-android-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so the build can derive versionName from the
          # latest git tag (git describe --tags).
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: ./.github/actions/android-sdk

      - name: Restore debug signing key
        if: inputs.build_type == 'debug'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$HOME/.android/debug.keystore"
            echo "Debug keystore restored from secret."
          else
            echo "DEBUG_KEYSTORE_BASE64 not set; using the default debug keystore."
          fi

      - name: Build APK
        env:
          # Consumed by the release signingConfig in app/build.gradle.kts. Unset
          # for debug builds, which fall back to the debug key.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew --no-daemon :app:assembleRelease
            echo "BUILT_APK=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            ./gradlew --no-daemon :app:assembleDebug
            echo "BUILT_APK=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: picnic-tv-${{ inputs.build_type }}-${{ github.run_number }}
          path: ${{ env.BUILT_APK }}
          retention-days: 30
          if-no-files-found: error
