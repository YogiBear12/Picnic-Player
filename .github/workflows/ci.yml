# CI for the native Android app: assemble + lint + JVM unit tests +
# ktlint on PR or manual dispatch (not on push — mirrored remotes without a
# runner would otherwise queue forever on every sync).

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: ./.github/actions/android-sdk

      - name: Assemble + lint + unit tests + ktlint
        id: quality
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :app:ktlintCheck \
            :app:assembleDebug \
            :app:lintDebug \
            :app:testDebugUnitTest

      - name: Print lint report on failure
        if: failure() && steps.quality.outcome == 'failure'
        run: |
          set -euo pipefail
          REPORTS=(
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            app/build/intermediates/lint_intermediate_text_report/debug/lint-results-debug.txt
          )
          found=0
          for REPORT in "${REPORTS[@]}"; do
            if [[ -f "$REPORT" ]]; then
              echo "===== FULL LINT REPORT ($REPORT) ====="
              cat "$REPORT"
              echo "===== END LINT REPORT ====="
              found=1
              break
            fi
          done
          if [[ "$found" -eq 0 ]]; then
            echo "Lint text report not found at known paths; searching..."
            find app/build -name 'lint-results*.txt' -print -exec echo '--- {} ---' \; -exec cat {} \; 2>/dev/null || true
          fi

      - name: Print ktlint reports on failure
        if: failure() && steps.quality.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "===== ktlint reports ====="
          find app/build/reports/ktlint -type f \( -name '*.txt' -o -name '*.html' -o -name '*.xml' \) \
            -print -exec echo '--- {} ---' \; -exec cat {} \; 2>/dev/null || echo "(no ktlint reports)"

      - name: Upload lint report
        if: failure() && steps.quality.outcome == 'failure'
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: lint-results-debug
          path: |
            app/build/intermediates/lint_intermediate_text_report/debug/**/lint-results-debug.txt
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn

      - name: Upload ktlint reports
        if: failure() && steps.quality.outcome == 'failure'
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            app/build/reports/ktlint/**
          if-no-files-found: warn

  # APK artifacts: use the manual "Build Android TV" workflow (workflow_dispatch).
